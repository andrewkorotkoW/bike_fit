[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bikefit"
version = "0.1.0"
description = "Анализ велопосадки по фото/видео: MediaPipe + геометрия + рекомендации"
requires-python = ">=3.11"
dependencies = [
  "mediapipe==0.10.14",
  "opencv-python-headless==4.10.0.84",
  "numpy<2",
  "reportlab>=4.0,<5",
  "svglib>=1.5",
]

[tool.setuptools]
packages = ["bikefit"]
